<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="description" content="DOTAFS — personal learning notes, research, and portfolios." />
    <meta name="theme-color" content="#1b1d1f" />
    <title>DOTAFS — Personal Homepage</title>
    <link rel="canonical" href="https://dotafs.com/home/en/" />
    <script>
      (() => {
        let language;
        try { language = localStorage.getItem("dotafs-language"); } catch (_) {}
        const destination = language === "zh" ? "/home/" : "/home/en/";
        location.replace(destination + location.search + location.hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0;url=/home/en/" /></noscript>
  </head>
  <body>
    <p><a href="/home/en/">DOTAFS — Personal homepage</a> · <a href="/home/">中文主页</a></p>
  </body>
</html>
