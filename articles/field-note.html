        <h1>随手记模板：最近在想的一件小事</h1>
        <p class="article-lead">
          不是每个想法都需要成为长篇教程。这份模板适合保存一个问题、一次灵感或一段尚未结束的思考。
        </p>

        <div class="article-body-copy">
          <section>
            <h2>观察</h2>
            <p>从一个具体瞬间开始：看到了什么、读到了什么，或者在项目中遇到了什么反常现象。</p>
          </section>
          <section>
            <h2>联想</h2>
            <p>写下它与过去经验的联系。此时不必急着证明，只要把推理线索保留下来。</p>
          </section>
          <section>
            <h2>还没想完</h2>
            <p>最后留下一个开放问题。以后有新答案时，这篇短文就能继续生长。</p>
          </section>
        </div>
